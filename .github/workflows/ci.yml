name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
      - run: cargo check --target thumbv7m-none-eabi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7m-none-eabi
      - run: cargo clippy --target thumbv7m-none-eabi -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: Build (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "rtt"
          - "async-await"
          - "ecc"
          - "rtt,async-await"
          - "rtt,ecc"
          - "async-await,ecc"
          - "rtt,async-await,ecc"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
      - name: Build
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo build --target thumbv7m-none-eabi --no-default-features
          else
            cargo build --target thumbv7m-none-eabi --no-default-features --features "${{ matrix.features }}"
          fi

  build-default:
    name: Build (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
      - run: cargo build --target thumbv7m-none-eabi

  test-lib:
    name: Test (library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features

  loom:
    name: Loom
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom
      LOOM_LOCATION: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --release loom
      - run: cargo test --lib --release --no-default-features loom

  kani:
    name: Kani (-j ${{ matrix.jobs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jobs: [2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Track memory
        run: nohup sh -c 'while sleep 5; do free -m | awk "/^Mem/ { print \$3 }"; done' > memory.log 2>&1 &
      # Same version as the flake.
      - uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: "0.66.0"
          args: --output-format=terse -j ${{ matrix.jobs }}
      - name: Peak memory
        if: always()
        run: echo "Peak $(sort -n memory.log | tail -1) MB of $(free -m | awk '/^Mem/ { print $2 }') MB"

  miri:
    name: Miri (${{ matrix.features || 'no-default-features' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "ecc"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri test
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo +nightly miri test --no-default-features
          else
            cargo +nightly miri test --no-default-features --features "${{ matrix.features }}"
          fi

  test:
    name: Test (QEMU, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
      - name: Run tests
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo xtask test --release
          else
            cargo xtask test
          fi
